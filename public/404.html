<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b203d" />
    <title>找不到頁面 | Page not found | NexaForge</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #10233f; background: #f3f7fb; }
      main { width: min(100%, 640px); padding: clamp(28px, 6vw, 56px); text-align: center; background: #fff; border: 1px solid #d7e2ee; border-radius: 24px; box-shadow: 0 24px 64px rgba(11, 32, 61, .12); }
      .code { display: block; color: #0b6b56; font-size: clamp(3rem, 12vw, 6rem); font-weight: 800; line-height: 1; }
      h1 { margin: 18px 0 8px; font-size: clamp(1.6rem, 5vw, 2.4rem); }
      p { margin: 0 auto 28px; max-width: 44ch; color: #435774; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; color: #fff; background: #0b6b56; border-radius: 10px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f0a128; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="code" aria-hidden="true">404</span>
      <h1>找不到頁面 / Page not found</h1>
      <p>這個網址不存在或已移動。The address may be incorrect or the page may have moved.</p>
      <nav aria-label="返回網站 / Return to site">
        <a href="/">繁體中文首頁</a>
        <a href="/en">English home</a>
      </nav>
    </main>
  </body>
</html>
