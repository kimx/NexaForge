<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple HTML encoder and decoder utility." />
  <title>HTML Encoder</title>
  <style>
    :root {
      --bg-a: #0f172a;
      --bg-b: #1e293b;
      --panel: rgba(15, 23, 42, 0.78);
      --edge: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-2: #06b6d4;
      --good: #22c55e;
      --warn: #f59e0b;
      --danger: #f43f5e;
      --shadow: 0 25px 60px rgba(2, 6, 23, 0.45);
      --radius: 20px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: "Alegreya Sans", "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--sans);
      color: var(--text);
    }

    body {
      background:
        radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.22), transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(6, 182, 212, 0.2), transparent 35%),
        linear-gradient(130deg, var(--bg-a), var(--bg-b));
      padding: 28px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 18px;
    }

    .shell {
      width: min(1080px, 100%);
      display: grid;
      gap: 14px;
      animation: pop 500ms ease-out;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      backdrop-filter: blur(12px);
      border: 1px solid var(--edge);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(6, 182, 212, 0.06));
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
    }

    .title {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 2rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--edge);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .pane {
      display: grid;
      gap: 10px;
    }

    .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.95rem;
      color: #dbeafe;
    }

    .count {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.84rem;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid var(--edge);
      padding: 14px;
      font-family: var(--mono);
      font-size: 0.95rem;
      line-height: 1.45;
      color: #e2e8f0;
      background: rgba(2, 6, 23, 0.65);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button,
    select,
    option {
      border: 1px solid var(--edge);
      color: var(--text);
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      font-size: 0.9rem;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    button:hover,
    button:focus-visible,
    select:hover,
    select:focus-visible {
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      outline: none;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #001f2f;
      border-color: transparent;
      font-weight: 700;
    }

    .good {
      background: rgba(34, 197, 94, 0.12);
      color: #dcfce7;
      border-color: rgba(34, 197, 94, 0.45);
    }

    .small {
      padding: 8px 12px;
      font-size: 0.82rem;
    }

    .status {
      min-height: 24px;
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ok { color: var(--good); }
    .warn { color: var(--warn); }
    .danger { color: var(--danger); }

    .meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.86rem;
    }

    .option-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
      align-items: center;
    }

    .option-row label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      font-size: 0.89rem;
    }

    .option-row input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .result h3 {
      margin: 0;
      font-size: 0.98rem;
      color: #dbeafe;
    }

    .result span {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .footer {
      margin-top: 10px;
      text-align: right;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .footer a {
      color: #93c5fd;
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .card {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <h1 class="title">HTML Encoder / Decoder</h1>
      <p class="subtitle">
        在 HTML 中把特殊字元轉成實體，或把實體還原回原字元。可用於輸出到網頁內容、模板與測試字串。
      </p>
    </header>

    <section class="card">
      <div class="pane">
        <div class="result">
          <h3>輸入</h3>
          <span id="inCount" class="count">0 字元</span>
        </div>
        <label for="inputText" class="meta">
          可輸入任意文字、HTML 片段、JSON 或程式碼。點擊「編碼」產生可直接放進 HTML 屬性/內容的字串。
        </label>
        <textarea id="inputText" placeholder="貼上要處理的文字..."></textarea>
        <div class="toolbar">
          <button id="btnEncode" class="primary">編碼</button>
          <button id="btnDecode">解碼</button>
          <button id="btnClear">清空</button>
          <label class="small" for="modeSelect">預覽風格</label>
          <select id="modeSelect" class="small">
            <option value="named">HTML 實體名稱</option>
            <option value="hex">十六進位實體</option>
            <option value="decimal">十進位實體</option>
          </select>
        </div>
        <div class="option-row">
          <label><input type="checkbox" id="skipNochange" checked />不變更引號轉換行為</label>
          <label><input type="checkbox" id="encodeNewlines" />保留換行為 <code>\n</code></label>
        </div>
      </div>

      <div class="pane">
        <div class="result">
          <h3>輸出</h3>
          <span id="outCount" class="count">0 字元</span>
        </div>
        <label for="outputText" class="meta">
          輸出欄可直接複製到程式中，支援反白並一鍵複製。
        </label>
        <textarea id="outputText" readonly placeholder="結果會顯示在這裡"></textarea>
        <div class="toolbar">
          <button id="btnCopy" class="good">複製輸出</button>
        </div>
        <div id="copyMsg" class="status"></div>
      </div>
    </section>

    <div class="footer">
      提示：此頁僅做 HTML 字符實體轉換，未做腳本內容過濾，請避免直接插入不可信任輸入到 HTML 內文。
    </div>
  </div>

  <script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const inCount = document.getElementById('inCount');
    const outCount = document.getElementById('outCount');
    const copyMsg = document.getElementById('copyMsg');
    const modeSelect = document.getElementById('modeSelect');
    const skipNochange = document.getElementById('skipNochange');
    const encodeNewlines = document.getElementById('encodeNewlines');

    function updateCounts() {
      inCount.textContent = `${inputText.value.length} 字元`;
      outCount.textContent = `${outputText.value.length} 字元`;
    }

    function encodeHtml(input) {
      let s = input;
      if (skipNochange.checked) {
        s = s
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;');
      } else {
        s = s
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      if (modeSelect.value === 'hex') {
        s = convertByCodePoint(s, (cp) => `&#x${cp.toString(16).toUpperCase()};`, true);
      } else if (modeSelect.value === 'decimal') {
        s = convertByCodePoint(s, (cp) => `&#${cp};`, true);
      } else {
        s = encodeNamedOrSafe(s);
      }

      if (encodeNewlines.checked) {
        s = s.replaceAll('\r\n', '\n');
        s = s.replaceAll('\n', '&#10;').replaceAll('\t', '&#9;');
      }
      return s;
    }

    function encodeNamedOrSafe(input) {
      return input
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;')
        .replaceAll('`', '&#96;');
    }

    function convertByCodePoint(input, mapper, onlyPrintableLike) {
      return Array.from(input).map((ch) => {
        const cp = ch.codePointAt(0);
        if (!onlyPrintableLike) {
          return mapper(cp);
        }
        if (cp > 126) {
          return mapper(cp);
        }
        return ch;
      }).join('');
    }

    function decodeHtml(input) {
      const txt = document.createElement('textarea');
      txt.innerHTML = input;
      return txt.value;
    }

    function setMessage(message, type = '') {
      copyMsg.className = `status ${type}`;
      copyMsg.textContent = message;
      setTimeout(() => {
        if (copyMsg.textContent === message) {
          copyMsg.textContent = '';
          copyMsg.className = 'status';
        }
      }, 1800);
    }

    function encodeCurrent() {
      const text = inputText.value;
      if (!text) {
        outputText.value = '';
        updateCounts();
        setMessage('輸入是空的，請先輸入文字。', 'warn');
        return;
      }
      outputText.value = encodeHtml(text);
      updateCounts();
      setMessage('編碼完成', 'ok');
    }

    function decodeCurrent() {
      const text = inputText.value;
      if (!text) {
        outputText.value = '';
        updateCounts();
        setMessage('輸入是空的，請先輸入文字。', 'warn');
        return;
      }
      outputText.value = decodeHtml(text);
      updateCounts();
      setMessage('解碼完成', 'ok');
    }

    async function copyOutput() {
      if (!outputText.value) {
        setMessage('目前沒有可複製的內容', 'warn');
        return;
      }
      await navigator.clipboard.writeText(outputText.value);
      setMessage('已複製到剪貼簿', 'ok');
    }

    function clearAll() {
      inputText.value = '';
      outputText.value = '';
      updateCounts();
      setMessage('');
    }

    document.getElementById('btnEncode').addEventListener('click', encodeCurrent);
    document.getElementById('btnDecode').addEventListener('click', decodeCurrent);
    document.getElementById('btnCopy').addEventListener('click', copyOutput);
    document.getElementById('btnClear').addEventListener('click', clearAll);
    inputText.addEventListener('input', updateCounts);

    updateCounts();
  </script>
</body>
</html>
